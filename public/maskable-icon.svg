<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boltGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full bleed square background for maskable icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Content within 80% safe zone circle (center 410px diameter) -->
  <rect x="136" y="110" width="240" height="290" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4" />
  
  <rect x="170" y="150" width="120" height="10" rx="5" fill="#334155" />
  <rect x="170" y="175" width="80" height="8" rx="4" fill="#334155" opacity="0.7" />

  <!-- Electric Bolt -->
  <path d="M280 130 L190 260 H260 L210 380 L320 230 H250 Z" 
        fill="url(#boltGradMask)" 
        stroke="#78350f" 
        stroke-width="2" 
        stroke-linejoin="round" />
</svg>
