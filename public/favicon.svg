<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#ringGrad)" stroke-width="6" />

  <!-- Document / Quote Backdrop Sheet -->
  <rect x="116" y="100" width="280" height="320" rx="24" fill="#1e293b" stroke="#334155" stroke-width="4" />
  
  <!-- Subtle line slots representing invoice / estimate rows -->
  <rect x="156" y="150" width="140" height="12" rx="6" fill="#334155" />
  <rect x="156" y="180" width="90" height="10" rx="5" fill="#334155" opacity="0.7" />
  <rect x="156" y="340" width="120" height="12" rx="6" fill="#334155" />
  <rect x="156" y="366" width="160" height="14" rx="7" fill="#f59e0b" opacity="0.8" />

  <!-- Electric Bolt Icon (Central Highlight) -->
  <path d="M296 110 L184 270 H272 L216 410 L344 240 H256 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" 
        stroke="#78350f" 
        stroke-width="3" 
        stroke-linejoin="round" />
</svg>
